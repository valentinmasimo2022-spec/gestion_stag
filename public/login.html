<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | Gestion des stagiaires</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <div class="auth-shell">
    <aside class="auth-illustration">
      <span class="eyebrow">Bienvenue</span>
      <h1>Gestion des stagiaires</h1>
      <p>
        Accédez au tableau de bord pour gérer les dossiers, les formations, les dates de stage
        et le statut des stagiaires.
      </p>
      <a href="/" class="link-light">Retour à l’accueil</a>
    </aside>

    <section class="auth-card">
      <h2>Connexion</h2>
      <form id="login-form" novalidate>
        <div class="champ-auth">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" placeholder="nom@exemple.com" autocomplete="off" required>
        </div>

        <div class="champ-auth">
          <label for="password">Mot de passe</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="off" required>
            <button type="button" class="toggle-password" aria-label="Afficher le mot de passe" data-target="password">👁</button>
          </div>
        </div>

        <button type="submit" class="bouton bouton-principal bouton-large"> Se connecter</button>
        <p id="login-message" class="auth-message" role="alert"></p>
      </form>
    </section>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
